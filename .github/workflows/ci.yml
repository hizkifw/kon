name: ci

on:
  push:
    branches: ['**']
    # A version tag is a release: the release job below publishes it.
    tags: ['v*.*.*']
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:

      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true
      - run: make check
      - run: make test-race

  # A release ships the models.dev catalog as it is on release day rather than
  # as last committed. It is fetched once, so every target embeds the same one.
  catalog:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true
      - run: make catalog-update
      - uses: actions/upload-artifact@v7
        with:
          name: catalog
          path: internal/catalog/snapshot.json.gz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  # Builds each release archive the way scripts/release.sh does, so every
  # push checks that each target builds and fits the size limit. On a version
  # tag the archives carry the tag's version and are what the release
  # publishes, so it never builds them again.
  build:
    needs: [catalog]
    # The catalog job only runs on a tag; elsewhere it is skipped and the
    # build uses the committed snapshot.
    if: ${{ !cancelled() && needs.catalog.result != 'failure' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.25.x'
          cache: true
      - if: startsWith(github.ref, 'refs/tags/')
        uses: actions/download-artifact@v8
        with:
          name: catalog
          path: internal/catalog
      - name: Build
        run: |
          version=v0.0.0-ci
          case "$GITHUB_REF" in
            refs/tags/*) version=$GITHUB_REF_NAME ;;
          esac
          ./scripts/release.sh "$version" "${{ matrix.goos }}/${{ matrix.goarch }}"
      - if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v7
        with:
          name: kon-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/kon_*
          if-no-files-found: error
          # The archive is compressed already, and only the release job below
          # reads it.
          compression-level: 0
          retention-days: 1

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [test, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      # checkout fetches only the tagged commit, so re-fetch the annotated tag
      # object; --notes-from-tag reads the release notes from its message.
      - run: git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
      - uses: actions/download-artifact@v8
        with:
          pattern: kon-*
          path: dist
          merge-multiple: true
      - run: ./scripts/checksums.sh dist
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --notes-from-tag
